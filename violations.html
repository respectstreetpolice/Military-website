<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المخالفات</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "tajawal", sans-serif;
            background: #100d18;
            color: white;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 35px 20px;
            background: #181323;
            border-bottom: 2px solid #633f91;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            color: #c5b7d8;
        }

        .section {
            width: 90%;
            margin: 40px auto;
        }

        .section-title {
            width: 100%;
            padding: 22px;
            background: #1b1624;
            border: 1px solid #633f91;
            border-radius: 10px;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #633f91;
            height: 60px;
            text-align: center;
            padding: 0;
        }

        th {
            background: #241b31;
            font-size: 18px;
        }

        td {
            background: #1b1624;
        }

        .input-cell {
            width: 100%;
            height: 60px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            text-align: center;
            font-size: 16px;
            padding: 10px;
        }

        .input-cell:focus {
            background: #241b31;
            box-shadow: inset 0 0 0 2px #9a6dcc;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background: #15111c;
            color: #9d91aa;
        }
    </style>
</head>
