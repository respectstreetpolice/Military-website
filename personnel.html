<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سجل المنتسبين</title>

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    font-family: "tajawal", sans-serif;
    background:
        radial-gradient(circle at 50% -10%, #382052 0%, transparent 45%),
        linear-gradient(135deg, #0b0910, #100d18 50%, #0c0912);

    color: white;

    min-height: 100vh;

    overflow-x: hidden;

    position: relative;
}

/* =========================
   الخلفية التكتيكية
========================= */

body::before {
    content: "";

    position: fixed;

    inset: 0;

    background-image:
        linear-gradient(
            rgba(140, 90, 190, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(140, 90, 190, 0.035) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    pointer-events: none;

    z-index: -2;
}

body::after {
    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    top: 20%;
    left: 50%;

    transform: translate(-50%, -50%);

    background: rgba(111, 63, 155, 0.08);

    filter: blur(100px);

    border-radius: 50%;

    pointer-events: none;

    z-index: -1;

    animation: backgroundGlow 6s ease-in-out infinite alternate;
}

/* =========================
   الهيدر
========================= */

header {
    position: relative;

    text-align: center;

    padding: 40px 20px 32px;

    background: rgba(24, 19, 35, 0.94);

    border-bottom: 2px solid #633f91;

    box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.45);

    animation: headerEnter 0.8s ease;

    overflow: hidden;
}

header::before {
    content: "";

    position: absolute;

    bottom: 0;
    left: 50%;

    width: 180px;
    height: 2px;

    transform: translateX(-50%);

    background: #a978df;

    box-shadow:
        0 0 15px #8c5ab8;

    animation: headerLine 3s ease-in-out infinite;
}

header h1 {
    font-size: 38px;

    margin-bottom: 10px;

    letter-spacing: 1px;
}

header p {
    color: #c5b7d8;

    font-size: 17px;
}

/* =========================
   الأقسام
========================= */

.section {
    width: 92%;

    margin: 45px auto;

    animation: sectionEnter 0.7s ease;
}

/* =========================
   عنوان القسم
========================= */

.section-title {
    position: relative;

    width: 100%;

    padding: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(38, 28, 52, 0.98),
            rgba(25, 19, 34, 0.98)
        );

    border: 1px solid #633f91;

    border-radius: 12px;

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    margin-bottom: 15px;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35);

    transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;

    overflow: hidden;
}

/* الخط المتحرك */

.section-title::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #a978df,
            transparent
        );

    transition: left 0.5s ease;
}

.section-title:hover {
    border-color: #9a6dcc;

    box-shadow:
        0 0 25px rgba(128, 76, 175, 0.2);

    transform: translateY(-2px);
}

.section-title:hover::before {
    left: 100%;
}

/* =========================
   الجدول
========================= */

table {
    width: 100%;

    border-collapse: separate;

    border-spacing: 0;

    overflow: hidden;

    border-radius: 10px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.4);
}

th,
td {
    border: 1px solid #493064;

    height: 60px;

    text-align: center;

    padding: 0;

    transition:
        background 0.2s ease,
        border-color 0.2s ease;
}

/* رؤوس الأعمدة */

th {
    background:
        linear-gradient(
            135deg,
            #2b2039,
            #21192d
        );

    font-size: 17px;

    color: #eee7f5;

    height: 65px;

    position: sticky;

    top: 0;

    z-index: 5;
}

/* الخانات */

td {
    background: rgba(27, 22, 36, 0.96);
}/* حركة الصف */

tr:hover td {
    background: #241b31;

    border-color: #69458c;
}

/* =========================
   خانات الإدخال
========================= */

.input-cell {
    width: 100%;

    height: 60px;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    text-align: center;

    font-size: 16px;

    padding: 10px;

    transition:
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.input-cell::placeholder {
    color: #766b82;
}

.input-cell:focus {
    background: #241b31;

    box-shadow:
        inset 0 0 0 2px #9a6dcc,
        0 0 15px rgba(140, 90, 190, 0.12);
}

/* =========================
   الفوتر
========================= */

footer {
    text-align: center;

    padding: 25px;

    margin-top: 60px;

    background: rgba(15, 11, 21, 0.95);

    border-top: 1px solid #342444;

    color: #9d91aa;

    font-size: 14px;
}

/* =========================
   الحركات
========================= */

@keyframes headerEnter {

    from {
        opacity: 0;

        transform: translateY(-20px);
    }

    to {
        opacity: 1;

        transform: translateY(0);
    }
}

@keyframes sectionEnter {

    from {
        opacity: 0;

        transform: translateY(20px);
    }

    to {
        opacity: 1;

        transform: translateY(0);
    }
}

@keyframes backgroundGlow {

    from {
        opacity: 0.5;

        transform:
            translate(-50%, -50%)
            scale(0.9);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.1);
    }
}

@keyframes headerLine {

    0% {
        width: 100px;

        opacity: 0.5;
    }

    50% {
        width: 220px;

        opacity: 1;
    }

    100% {
        width: 100px;

        opacity: 0.5;
    }
}

/* =========================
   الشاشات الصغيرة
========================= */

@media (max-width: 900px) {

    .section {
        width: 96%;
    }

    table {
        min-width: 800px;
    }

    .section {
        overflow-x: auto;
    }

    header h1 {
        font-size: 30px;
    }
}

    </style>
